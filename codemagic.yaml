workflows:
  expo-ios:
    name: Build iOS App via Expo Prebuild
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Install EAS and Expo CLI
        script: |
          npm install -g eas-cli expo-cli
      - name: Install npm dependencies
        script: |
          npm install
      - name: Generate iOS Native Folder
        script: |
          # Lệnh này tự sinh thư mục ios trên server Mac nếu chưa có
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS Package
        script: |
          # Tìm tên Scheme tự động và tiến hành build Archive
          SCHEME_NAME=$(xcodebuild -list -workspace ios/*.xcworkspace | grep -m 1 "Schemes:" -A 1 | tail -n 1 | xargs)

          xcodebuild -workspace ios/*.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath build/ios/iphone.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath build/ios/iphone.xcarchive \
            -exportPath build/ios/exported \
            -exportOptionsPlist ios/$SCHEME_NAME/Info.plist
    artifacts:
      - build/ios/exported/*.ipa
